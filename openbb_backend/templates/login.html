<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Desk — Login</title>
    <style>
        :root {
            --ink: #e8efe6;
            --muted: #9aafa0;
            --bg0: #0c1410;
            --bg1: #15241c;
            --accent: #d4a574;
            --line: rgba(232, 239, 230, 0.12);
            --down: #e07a5f;
            --font-display: Georgia, "Times New Roman", serif;
            --font-body: system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-body);
            background: var(--bg0);
            color: var(--ink);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .atmosphere {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background:
                radial-gradient(ellipse 80% 60% at 50% 0%, rgba(212,165,116,0.06) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 20% 100%, rgba(125,206,160,0.04) 0%, transparent 50%);
        }
        .login-box {
            position: relative; z-index: 1;
            background: var(--bg1);
            border: 1px solid var(--line);
            border-radius: 2px;
            padding: 2.5rem 2rem 2rem;
            width: 100%;
            max-width: 340px;
        }
        h1 {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: -0.02em;
            margin-bottom: 1.75rem;
            text-align: center;
            color: var(--ink);
        }
        .form-group {
            margin-bottom: 1.1rem;
        }
        label {
            display: block;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 0.35rem;
            color: var(--muted);
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 0.6rem 0.75rem;
            background: var(--bg0);
            border: 1px solid var(--line);
            border-radius: 2px;
            color: var(--ink);
            font-family: var(--font-body);
            font-size: 0.95rem;
        }
        input:focus {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            border-color: transparent;
        }
        button {
            width: 100%;
            padding: 0.6rem;
            background: var(--accent);
            color: var(--bg0);
            border: 1px solid var(--accent);
            border-radius: 1px;
            font-family: var(--font-body);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: filter 0.15s;
        }
        button:hover { filter: brightness(1.08); }
        button:active { filter: brightness(0.95); }
        .error {
            background: rgba(224, 122, 95, 0.1);
            border: 1px solid rgba(224, 122, 95, 0.3);
            color: var(--down);
            padding: 0.5rem 0.75rem;
            border-radius: 2px;
            margin-bottom: 1.1rem;
            font-size: 0.85rem;
        }
        .branding {
            text-align: center;
            margin-top: 1.25rem;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="atmosphere"></div>
    <div class="login-box">
        <h1>Stock Desk</h1>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/desk/auth/login">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Sign In</button>
        </form>
        <div class="branding">AI Stock Checker</div>
    </div>
</body>
</html>
